<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050505">

<title>Alislamiah AI</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    background: #050505;
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
}

.container {
    width: 100%;
    max-width: 500px;
    padding: 30px;
    text-align: center;
}

.logo {
    width: 90px;
    height: 90px;
    margin: 0 auto 25px;
    border-radius: 25px;
    background: #111111;
    border: 1px solid #292929;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 35px rgba(255,255,255,0.06);
}

.logo span {
    font-size: 36px;
    font-weight: bold;
}

h1 {
    font-size: 32px;
    margin-bottom: 12px;
}

.description {
    color: #999999;
    font-size: 16px;
    line-height: 1.8;
    margin-bottom: 35px;
}

.open-button {
    display: block;
    width: 100%;
    padding: 17px 20px;
    border-radius: 15px;
    background: #ffffff;
    color: #000000;
    text-decoration: none;
    font-size: 17px;
    font-weight: bold;
    transition: 0.25s;
}

.open-button:hover {
    background: #e5e5e5;
    transform: translateY(-2px);
}

.open-button:active {
    transform: scale(0.97);
}

.footer {
    margin-top: 30px;
    color: #555555;
    font-size: 13px;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">
        <span>AI</span>
    </div>

    <h1>Alislamiah AI</h1>

    <p class="description">
        مرحباً بك في Alislamiah AI<br>
        متصفحك الذكي للبحث والتصفح.
    </p>

    <a
        href="https://mohamedmadoui5195.github.io/Alislamiah-AI/"
        class="open-button"
    >
        فتح Alislamiah AI
    </a>

    <div class="footer">
        © 2026 Alislamiah AI
    </div>

</div>

</body>
</html>
